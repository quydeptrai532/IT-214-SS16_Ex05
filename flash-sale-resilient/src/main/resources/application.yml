server:
  port: 8400
spring:
  application:
    name: flash-sale-resilient
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2s
      timeout: 2s
      lettuce:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 8
  cache:
    type: redis
app:
  cache:
    flash-sale-ttl: 2m
  warmup:
    enabled: true
  db:
    query-delay-ms: 120
  resilience:
    rate-limiter:
      limit-for-period: 50
      refresh-period: 1s
      timeout: 0ms
    circuit-breaker:
      failure-rate-threshold: 60
      sliding-window-size: 20
      wait-duration-in-open-state: 5s
  local-fallback:
    ttl: 30s
logging:
  level:
    com.example.flashsale: INFO
